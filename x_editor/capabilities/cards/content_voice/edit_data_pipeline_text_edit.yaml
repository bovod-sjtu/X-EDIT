schema_version: x-editor.operation-capability-card/v1
operation: edit_data_pipeline.text_edit
semantic_effects:
  - replace_spoken_content
  - insert_spoken_content
  - delete_spoken_content
supported_scopes:
  - global
  - segment
requirements:
  inputs:
    - inputs.input_audio
  evidence:
    - speech.source_text
preservation:
  - dimension: non_target_speech
    level: strong
    evidence_kind: declared_design_fact
    rationale: The operation is a local existing-audio edit whose documented purpose is to preserve source context.
  - dimension: speaker_identity
    level: moderate
    evidence_kind: declared_design_fact
    rationale: The tagged edit pipeline edits source audio instead of synthesizing an unrelated standalone utterance.
quality_characteristics:
  - dimension: lexical_instruction_fidelity
    level: unknown
    evidence_kind: unknown
    rationale: Route-specific listening judgments have not yet been collected.
artifact_risks:
  - risk: local_resynthesis_boundary_artifact
    level: unknown
    evidence_kind: unknown
    rationale: Boundary quality requires route-comparison listening review.
composition:
  supports_batch_targets: true
  cumulative_degradation_risk: unknown
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio
    - path: params.source_text
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: exact_source_transcript
    - path: params.instruction_st
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: tagged_lexical_edit
      value_guidance:
        - The value is the complete source transcript with only edited text wrapped in supported tags.
        - Removing all tags and keeping their source-side text must reproduce params.source_text exactly.
        - Rendering substitutions, insertions, and deletions must reproduce params.target_text when target_text is supplied.
        - Use only sub, ins, and del tags; never emit prose, placeholders, word ids, or span notation as instruction_st.
        - >-
          A whole-utterance replacement is legal: place the complete
          params.source_text inside one sub tag and put the complete target
          utterance in targ.
        - >-
          Escape XML attribute metacharacters in targ, for example '&' as
          '&amp;'; params.target_text remains the unescaped listener-visible
          text.
      value_examples:
        - '<sub targ="new">old</sub>'
        - 'keep<ins> new</ins> text'
        - 'keep <del>removed</del> text'
    - path: params.target_text
      value_type: string
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: rendered_target_transcript
    - path: params.language
      value_type: string
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: speech_language
  framework_owned:
    - params.output_path
    - params.service_url
    - params.output_dir
    - params.trace_id
  conditional_rules: []
limitations:
  - The edit_data_pipeline backend requires inputs strictly shorter than 30 seconds; the dots_tts_edit backend uses its own source-plus-output context budget instead. Apply the limits of the explicitly selected backend.
  - An external aligner failure is reported as alignment_backend_failure; it is not converted into a copied input or successful delivery.
  - instruction_st supports only sub, ins, and del lexical labels.
  - Multi-target replacement belongs in one complete instruction_st when all replacements share the same source segment.
  - This service performs source-text alignment internally. Externally supplied word_timestamps are not a required argument for a lexical replacement in an already identified source transcript. Additional perception is needed when the source wording, selected occurrence, speaker, or scope is unresolved, not solely to recreate this internal alignment.
  - Tag syntax, stripped-source equality, and the 30-second segmentation boundary require operation-specific validation beyond the parameter condition DSL.
  - Alignment-backed local repair is for a proper source subspan; a whole-utterance substitution uses the one-shot path when the source audio is below the service limit.
provenance:
  - source_path: x_editor/tools/catalog/edit_data_pipeline/manual.yaml
    source_kind: manual
  - source_path: x_editor/runtime/operation_normalizers.py
    source_kind: runtime_handler
  - source_path: x_editor/runtime/audio_plan_executor.py
    source_kind: runtime_handler
  - source_path: tests/test_gemini_executor_contracts.py
    source_kind: test
