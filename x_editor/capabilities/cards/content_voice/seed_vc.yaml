schema_version: x-editor.operation-capability-card/v1
operation: seed_vc
semantic_effects:
  - convert_to_reference_voice
supported_scopes:
  - global
  - segment
requirements:
  inputs:
    - inputs.input_audio
    - inputs.reference_audio_path
  evidence:
    - voice.reference_audio
preservation:
  - dimension: spoken_content
    level: strong
    evidence_kind: declared_design_fact
    rationale: The documented purpose is reference-speaker conversion while preserving linguistic content.
  - dimension: broad_prosody
    level: moderate
    evidence_kind: declared_design_fact
    rationale: The capability description states broad prosody preservation rather than exact waveform preservation.
quality_characteristics:
  - dimension: reference_speaker_similarity
    level: unknown
    evidence_kind: unknown
    rationale: Similarity has not been assigned an approved listening prior.
artifact_risks:
  - risk: conversion_artifact
    level: unknown
    evidence_kind: unknown
    rationale: Artifact severity depends on source and reference audio and requires listening review.
composition:
  supports_batch_targets: false
  cumulative_degradation_risk: unknown
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: source_speech_audio
    - path: inputs.reference_audio_path
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: target_voice_reference_audio
    - path: params.diffusion_steps
      value_type: integer
      required: false
      enum_values: []
      minimum: 1
      maximum: 100
      default: 30
      semantic_role: diffusion_iteration_count
    - path: params.length_adjust
      value_type: number
      required: false
      enum_values: []
      minimum: 0.5
      maximum: 2.0
      default: 1.0
      semantic_role: output_length_ratio
    - path: params.inference_cfg_rate
      value_type: number
      required: false
      enum_values: []
      minimum: 0.0
      maximum: 1.0
      default: 0.7
      semantic_role: conversion_guidance_strength
  framework_owned:
    - params.output_path
    - params.service_url
  conditional_rules: []
limitations:
  - The reference should be clean and dominated by the intended target speaker.
  - This operation does not change spoken words.
  - The source supplies linguistic content; the reference supplies speaker conditioning. This is not a reference rhythm, accent-only, or time-varying emotion transfer contract.
  - The deployed backend may downmix and resample audio. Reference similarity, pitch transfer, and preservation of background or spatial sound require actual-output checks; successful conversion alone does not establish them.
  - File existence and source/reference semantic-role separation require runtime artifact validation beyond the parameter condition DSL.
provenance:
  - source_path: x_editor/tools/catalog/seed_vc/manual.yaml
    source_kind: manual
  - source_path: x_editor/tools/catalog/seed_vc/mcp_server.py
    source_kind: service_schema
  - source_path: x_editor/runtime/tool_contract_verifier.py
    source_kind: runtime_handler
  - source_path: tests/test_gemini_executor_contracts.py
    source_kind: test
