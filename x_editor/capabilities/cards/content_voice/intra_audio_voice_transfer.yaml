schema_version: x-editor.operation-capability-card/v1
operation: intra_audio_voice_transfer
semantic_effects:
  - transfer_voice_between_in_audio_speakers
  - swap_in_audio_speaker_voices
supported_scopes:
  - speaker
  - segment
  - timeline
requirements:
  inputs:
    - inputs.input_audio
  evidence:
    - speech.speaker_segments
    - speech.speaker_profiles
preservation:
  - dimension: global_timeline_duration
    level: strong
    evidence_kind: declared_design_fact
    rationale: Converted chunks are duration-fitted before replacement on the original timeline.
  - dimension: spoken_content
    level: strong
    evidence_kind: declared_design_fact
    rationale: The operation converts selected speaker timbre without changing the transcript.
  - dimension: overlapped_speech
    level: weak
    evidence_kind: declared_design_fact
    rationale: The capability explicitly states that overlapped speech cannot be perfectly preserved.
quality_characteristics:
  - dimension: cross_speaker_timbre_transfer
    level: unknown
    evidence_kind: unknown
    rationale: Transfer quality requires listening review for each mapping type.
artifact_risks:
  - risk: overlap_reconstruction_artifact
    level: unknown
    evidence_kind: declared_design_fact
    rationale: Overlap preservation is limited, but severity has not been measured.
  - risk: short_segment_conversion_failure
    level: unknown
    evidence_kind: declared_design_fact
    rationale: Runtime skips target segments below its supported duration threshold.
composition:
  supports_batch_targets: true
  cumulative_degradation_risk: unknown
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: multi_speaker_source_audio
    - path: params.instruction
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: speaker_transfer_intent
    - path: params.source_speakers
      value_type: array
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: speakers_to_convert
    - path: params.target_speaker
      value_type: string
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: reference_speaker_in_audio
    - path: params.source_selector
      value_type: object
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: speakers_to_convert_selector
    - path: params.reference_selector
      value_type: object
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: reference_speaker_selector
    - path: params.speaker_map
      value_type: array
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: explicit_speaker_transfer_mappings
    - path: params.target_span
      value_type: object
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: scoped_transfer_span
  framework_owned:
    - params.output_path
    - params.perception_report
    - params.source_text
    - params.service_url
  conditional_rules: []
limitations:
  - The source audio must contain both the speaker to convert and the reference speaker.
  - Overlapped speech is not perfectly preserved.
  - Target segments shorter than the runtime minimum may be skipped.
  - Speaker count, mapping resolvability, and the target-span reference choice require evidence-aware validation beyond the parameter condition DSL.
provenance:
  - source_path: x_editor/tools/catalog/intra_audio_voice_transfer/manual.yaml
    source_kind: manual
  - source_path: x_editor/tools/catalog/intra_audio_voice_transfer/capability.yaml
    source_kind: manual
  - source_path: x_editor/runtime/intra_audio_voice_transfer.py
    source_kind: runtime_handler
  - source_path: tests/test_intra_audio_voice_transfer.py
    source_kind: test
