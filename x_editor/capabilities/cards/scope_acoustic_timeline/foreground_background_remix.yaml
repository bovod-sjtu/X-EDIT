schema_version: x-editor.operation-capability-card/v1
operation: foreground_background_remix
semantic_effects: [foreground_remove, foreground_extract]
supported_scopes: [global, timeline]
requirements:
  inputs: [inputs.input_audio]
  evidence: [foreground_background_role_definition]
preservation:
  - dimension: background_timeline
    level: strong
    evidence_kind: declared_design_fact
    rationale: The default renderer fits separated stems to the original mixed-audio duration before remixing.
  - dimension: background_fidelity
    level: unknown
    evidence_kind: unknown
    rationale: Fidelity depends on source separation and has no reviewed development prior.
quality_characteristics:
  - dimension: foreground_background_separation_quality
    level: unknown
    evidence_kind: unknown
    rationale: Stem labels and separation quality require review for each asset class.
artifact_risks:
  - risk: separation_leakage
    level: unknown
    evidence_kind: unknown
    rationale: Provider labels bind the selected stems but do not certify acoustic separation quality.
composition:
  supports_batch_targets: unknown
  cumulative_degradation_risk: medium
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: mixed_foreground_background_audio
    - path: params.foreground_action
      value_type: enum
      required: true
      enum_values: [remove_foreground, isolate_foreground]
      minimum: null
      maximum: null
      default: null
      semantic_role: foreground_action
    - path: params.foreground_stem_policy
      value_type: enum
      required: false
      enum_values: [speech, voice, vocal, vocals, foreground]
      minimum: null
      maximum: null
      default: speech
      semantic_role: foreground_stem_selector
    - path: params.background_stem_policy
      value_type: enum
      required: false
      enum_values: [background, music, instrumental, accompaniment]
      minimum: null
      maximum: null
      default: background
      semantic_role: background_stem_selector
    - path: params.foreground_gain_db
      value_type: number
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: foreground_gain_db
    - path: params.background_gain_db
      value_type: number
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: background_gain_db
  framework_owned: [params.output_path, params.output_dir, params.instruction, params.source_text, params.model_family, params.output_format, params.preserve_duration, params._agentic_mode]
  conditional_rules: []
limitations:
  - Availability is conditional on the speech_separation capability.
  - Foreground means vocals, which may contain multiple speakers; accompaniment separation cannot isolate an overlapping speaker.
  - Semantic stem selection requires unique provider labels, never positional fallback; acoustic quality needs separate verification.
  - speech_edit_core_v2 exposes only remove_foreground and isolate_foreground. edit_foreground and its nested parameters are unavailable in this profile; another entry point must explicitly offer a typed nested composition contract to use them.
provenance:
  - source_path: x_editor/tools/catalog/foreground_background_remix/manual.yaml
    source_kind: manual
  - source_path: x_editor/tools/catalog/foreground_background_remix/capability.yaml
    source_kind: manual
  - source_path: x_editor/runtime/foreground_background_remix.py
    source_kind: runtime_handler
  - source_path: tests/test_foreground_background_remix.py
    source_kind: test
