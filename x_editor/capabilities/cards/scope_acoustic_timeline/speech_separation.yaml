schema_version: x-editor.operation-capability-card/v1
operation: speech_separation
semantic_effects: [generic_source_separation, vocal_accompaniment_separation]
supported_scopes: [global, standalone_asset, timeline]
requirements:
  inputs: [inputs.input_audio]
  evidence: []
preservation:
  - dimension: source_timeline
    level: strong
    evidence_kind: declared_design_fact
    rationale: The runtime verifier requires every emitted stem to preserve source duration within tolerance.
quality_characteristics:
  - dimension: source_separation_quality
    level: unknown
    evidence_kind: unknown
    rationale: Stem isolation quality depends on the mixture and selected model and remains an Evaluator concern.
artifact_risks:
  - risk: source_leakage
    level: unknown
    evidence_kind: unknown
    rationale: Generic separation can leak sources and does not establish speaker identity.
composition:
  supports_batch_targets: false
  cumulative_degradation_risk: unknown
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: mixed_source_audio
    - path: params.model_family
      value_type: enum
      required: false
      enum_values: [bs_roformer, melband_roformer]
      minimum: null
      maximum: null
      default: bs_roformer
      semantic_role: separation_model_family
    - path: params.stem_policy
      value_type: enum
      required: false
      enum_values: [vocals, instrumental]
      minimum: null
      maximum: null
      default: vocals
      semantic_role: selected_vocal_or_accompaniment_stem
  framework_owned:
    - params.output_dir
    - params.output_path
    - params.output_format
    - params.model_filename
  conditional_rules: []
limitations:
  - The configured models separate vocals from accompaniment, not individual overlapping speakers.
  - Vocals may contain multiple speakers; a stem label is not a grounded speaker identity.
  - Exact target-speaker extraction requires a separately available, validated capability.
  - Missing or ambiguous labels fail; positional selectors are not Planner-visible semantic choices.
  - The v2 profile fixes output_format to WAV and does not expose arbitrary model filenames.
provenance:
  - source_path: x_editor/tools/catalog/speech_separation/manual.yaml
    source_kind: manual
  - source_path: x_editor/tools/catalog/speech_separation/mcp_server.py
    source_kind: service_schema
  - source_path: x_editor/runtime/audio_plan_executor.py
    source_kind: runtime_handler
  - source_path: x_editor/runtime/artifact_verification.py
    source_kind: runtime_handler
  - source_path: tests/test_artifact_principle_verification.py
    source_kind: test
