schema_version: x-editor.operation-capability-card/v1
operation: artifact_ops.extract_spans
semantic_effects: [timeline_extract]
supported_scopes: [speaker, segment, timeline]
requirements:
  inputs: [inputs.input_audio]
  evidence: [timeline_target_grounding]
preservation:
  - dimension: selected_span_waveform
    level: strong
    evidence_kind: declared_design_fact
    rationale: Selected regions are sliced from the source waveform; only joins may be crossfaded.
  - dimension: unselected_timeline
    level: weak
    evidence_kind: declared_design_fact
    rationale: Extraction intentionally omits all unselected regions from the output artifact.
quality_characteristics:
  - dimension: join_naturalness
    level: unknown
    evidence_kind: unknown
    rationale: A configurable crossfade exists, but no reviewed development prior establishes perceptual quality.
artifact_risks:
  - risk: discontinuity_between_extracted_spans
    level: unknown
    evidence_kind: unknown
    rationale: Join quality depends on target boundaries and crossfade selection.
composition:
  supports_batch_targets: true
  cumulative_degradation_risk: low
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio
    - path: params.selected_spans
      value_type: array
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: grounded_target_spans
    - path: params.selection_instruction
      value_type: string
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: target_selector
    - path: params.crossfade_ms
      value_type: integer
      required: false
      minimum: 0
      maximum: null
      default: 10
      semantic_role: join_crossfade_ms
  framework_owned: [params.output_path, params.output_dir, params.strict_explicit_spans, params._agentic_mode]
  conditional_rules: []
limitations:
  - Exact lexical extraction requires grounded word or segment boundaries.
  - Output is a compact artifact and does not preserve the original full timeline.
  - For retain-only requests, use this operation directly on the grounded spans; no reconstruct step or replacement audio is needed.
provenance:
  - source_path: x_editor/runtime/artifact_ops.py
    source_kind: runtime_handler
  - source_path: x_editor/runtime/audio_plan_executor.py
    source_kind: runtime_handler
  - source_path: tests/test_artifact_ops.py
    source_kind: test
