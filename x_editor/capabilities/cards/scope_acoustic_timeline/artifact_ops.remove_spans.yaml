schema_version: x-editor.operation-capability-card/v1
operation: artifact_ops.remove_spans
semantic_effects: [timeline_remove]
supported_scopes: [speaker, segment, timeline]
requirements:
  inputs: [inputs.input_audio]
  evidence: [timeline_target_grounding]
preservation:
  - dimension: non_target_waveform
    level: moderate
    evidence_kind: declared_design_fact
    rationale: Non-target regions are retained, with optional crossfading at deletion joins.
  - dimension: original_duration
    level: weak
    evidence_kind: declared_design_fact
    rationale: Removing spans shortens the timeline by design.
quality_characteristics:
  - dimension: deletion_join_naturalness
    level: unknown
    evidence_kind: unknown
    rationale: Crossfade controls exist, but perceptual quality has not been measured.
artifact_risks:
  - risk: prosodic_discontinuity_at_join
    level: unknown
    evidence_kind: unknown
    rationale: Risk depends on the grounded boundaries and chosen crossfade.
composition:
  supports_batch_targets: true
  cumulative_degradation_risk: low
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio
    - path: params.selected_spans
      value_type: array
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: grounded_target_spans
    - path: params.selection_instruction
      value_type: string
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: target_selector
    - path: params.crossfade_ms
      value_type: integer
      required: false
      minimum: 0
      maximum: null
      default: 10
      semantic_role: deletion_join_crossfade_ms
    - path: params.span_padding_sec
      value_type: number
      required: false
      minimum: 0
      maximum: null
      default: 0.0
      semantic_role: target_boundary_padding_sec
  framework_owned: [params.output_path, params.output_dir, params.strict_explicit_spans, params._agentic_mode]
  conditional_rules: []
limitations:
  - This deletes all simultaneous components in each selected interval; it does not remove only the named event or speaker. Samples outside the interval are preserved, but protected speech or background inside it is deleted too.
  - For selective source removal with overlapping protected content, choose an available source-selective workflow. A target interval alone is insufficient evidence that whole-interval deletion satisfies preservation.
  - The operation changes duration and shifts all later coordinates.
  - Chained removals must rebase later spans; batching base-timeline spans is preferred.
provenance:
  - source_path: x_editor/runtime/artifact_ops.py
    source_kind: runtime_handler
  - source_path: tests/test_artifact_ops.py
    source_kind: test
