schema_version: x-editor.operation-capability-card/v1
operation: artifact_ops.beep_spans
semantic_effects: [timeline_censor_tone]
supported_scopes: [speaker, segment, timeline]
requirements:
  inputs: [inputs.input_audio]
  evidence: [timeline_target_grounding]
preservation:
  - dimension: timeline_duration
    level: strong
    evidence_kind: declared_design_fact
    rationale: Each target span is replaced by a tone of matching duration.
  - dimension: non_target_waveform
    level: strong
    evidence_kind: declared_design_fact
    rationale: Samples outside selected spans are retained.
quality_characteristics:
  - dimension: censor_audibility
    level: high
    evidence_kind: declared_design_fact
    rationale: A deterministic sine tone is rendered across every selected span.
artifact_risks:
  - risk: tone_boundary_artifact
    level: unknown
    evidence_kind: unknown
    rationale: The tone has short fades, but perceptual boundary quality is not measured.
composition:
  supports_batch_targets: true
  cumulative_degradation_risk: low
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio
    - path: params.selected_spans
      value_type: array
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: grounded_target_spans
    - path: params.selection_instruction
      value_type: string
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: target_selector
    - path: params.frequency_hz
      value_type: number
      required: false
      minimum: null
      maximum: null
      default: 1000.0
      semantic_role: censor_tone_frequency_hz
    - path: params.span_padding_sec
      value_type: number
      required: false
      minimum: 0
      maximum: null
      default: 0.0
      semantic_role: target_boundary_padding_sec
  framework_owned: [params.output_path, params.output_dir, params.strict_explicit_spans, params._agentic_mode]
  conditional_rules: []
limitations:
  - This operation emits a censor tone; it does not synthesize a spoken lexical replacement.
  - Frequency safety or preference bounds are not established by the current repository.
provenance:
  - source_path: x_editor/runtime/artifact_ops.py
    source_kind: runtime_handler
  - source_path: tests/test_artifact_ops.py
    source_kind: test
