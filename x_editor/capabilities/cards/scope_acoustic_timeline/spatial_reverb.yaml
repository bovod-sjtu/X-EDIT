schema_version: x-editor.operation-capability-card/v1
operation: spatial_reverb
semantic_effects: [static_room_reverb]
supported_scopes: [global, segment]
requirements:
  inputs: [inputs.input_audio]
  evidence: []
preservation:
  - dimension: speech_content
    level: moderate
    evidence_kind: declared_design_fact
    rationale: The operation convolves the waveform and does not resynthesize words or speaker identity.
  - dimension: timeline_duration
    level: strong
    evidence_kind: declared_design_fact
    rationale: preserve_duration=true truncates the reverberant output to the input length.
quality_characteristics:
  - dimension: room_impression_fidelity
    level: unknown
    evidence_kind: unknown
    rationale: gpuRIR and synthetic backends exist, but no reviewed development prior compares perceived room fidelity.
artifact_risks:
  - risk: intelligibility_loss_from_wet_reverb
    level: unknown
    evidence_kind: unknown
    rationale: The manual identifies the risk at strong wet settings without a measured severity prior.
composition:
  supports_batch_targets: false
  cumulative_degradation_risk: medium
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio
    - path: params.room_preset
      value_type: enum
      required: false
      enum_values: [dry_studio, small_room, medium_room, large_empty_room, hall, cathedral, bathroom]
      minimum: null
      maximum: null
      default: medium_room
      semantic_role: room_preset
    - path: params.room_size_m
      value_type: array
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: room_dimensions_xyz_m
    - path: params.t60
      value_type: number
      required: false
      minimum: 0.08
      maximum: 8.0
      default: null
      semantic_role: reverberation_time_sec
    - path: params.dry_wet
      value_type: number
      required: false
      minimum: 0.0
      maximum: 0.95
      default: null
      semantic_role: wet_mix_ratio
    - path: params.source_distance_m
      value_type: number
      required: false
      minimum: 0.4
      maximum: null
      default: null
      semantic_role: source_receiver_distance_m
    - path: params.receiver_position_m
      value_type: array
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: receiver_position_xyz_m
    - path: params.source_position_m
      value_type: array
      required: false
      minimum: null
      maximum: null
      default: null
      semantic_role: source_position_xyz_m
    - path: params.rir_length_sec
      value_type: number
      required: false
      minimum: 0.12
      maximum: 8.0
      default: null
      semantic_role: impulse_response_duration_sec
    - path: params.preserve_duration
      value_type: boolean
      required: false
      minimum: null
      maximum: null
      default: false
      semantic_role: preserve_timeline_duration
    - path: params.wet_gain_db
      value_type: number
      required: false
      minimum: null
      maximum: null
      default: 0.0
      semantic_role: wet_signal_gain_db
  framework_owned: [params.output_path, params.output_dir, params.instruction, params.backend]
  conditional_rules: []
limitations:
  - It applies one static room response and does not model source motion.
  - It adds reverberation; dereverberation belongs to speech_enhancement.
  - Reverb can extend the output tail unless preserve_duration is true.
provenance:
  - source_path: x_editor/tools/catalog/spatial_reverb/manual.yaml
    source_kind: manual
  - source_path: x_editor/tools/catalog/spatial_reverb/mcp_server.py
    source_kind: service_schema
  - source_path: x_editor/runtime/spatial_reverb.py
    source_kind: runtime_handler
