schema_version: x-editor.operation-capability-card/v1
operation: edit_data_pipeline.pitch_shift
semantic_effects:
  - change_global_pitch
supported_scopes:
  - global
requirements:
  inputs:
    - inputs.input_audio
  evidence: []
preservation:
  - dimension: source_wording
    level: strong
    evidence_kind: declared_design_fact
    rationale: The direct PSOLA route changes waveform pitch without lexical synthesis.
  - dimension: source_timeline
    level: moderate
    evidence_kind: declared_design_fact
    rationale: The operation is designed as pitch conversion, while backend-specific duration behavior still requires verification.
quality_characteristics:
  - dimension: pitch_target_accuracy
    level: unknown
    evidence_kind: unknown
    rationale: Legal semitone selection does not establish perceptual accuracy.
  - dimension: speech_naturalness
    level: unknown
    evidence_kind: unknown
    rationale: Naturalness varies with magnitude, source, and backend.
artifact_risks:
  - risk: pitch_conversion_artifact
    level: unknown
    evidence_kind: unknown
    rationale: Backend comparison requires real-output listening review.
composition:
  supports_batch_targets: false
  cumulative_degradation_risk: unknown
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio_ref
    - path: params.semitones
      value_type: number
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: global_pitch_shift_semitones
    - path: params.method
      value_type: enum
      required: true
      enum_values:
        - psola
      minimum: null
      maximum: null
      default: psola
      semantic_role: pitch_conversion_backend
  framework_owned:
    - params.output_path
    - params.service_url
    - params.trace_id
  conditional_rules: []
limitations:
  - Local tagged pitch edits belong to edit_data_pipeline.pitch_rate_edit.
  - The current direct Planner contract exposes only PSOLA because non-PSOLA service methods require text that this operation route does not pass through; unsupported choices would be silently canonicalized to PSOLA.
  - The preferred backend and magnitude require route comparison rather than a global static ranking.
provenance:
  - source_path: x_editor/runtime/operation_normalizers.py
    source_kind: runtime_handler
  - source_path: x_editor/tools/catalog/edit_data_pipeline/manual.yaml
    source_kind: service_schema
  - source_path: x_editor/tools/catalog/edit_data_pipeline/client.py
    source_kind: runtime_handler
  - source_path: tests/test_edit_data_pipeline_client.py
    source_kind: test
