schema_version: x-editor.operation-capability-card/v1
operation: edit_data_pipeline.volume_normalize
semantic_effects:
  - normalize_global_level
  - change_global_level
supported_scopes:
  - global
  - segment
requirements:
  inputs:
    - inputs.input_audio
  evidence: []
preservation:
  - dimension: source_wording
    level: strong
    evidence_kind: declared_design_fact
    rationale: The operation applies deterministic level normalization without speech resynthesis.
  - dimension: timeline_duration
    level: strong
    evidence_kind: declared_design_fact
    rationale: Level normalization does not alter the sample timeline.
  - dimension: relative_internal_dynamics
    level: unknown
    evidence_kind: unknown
    rationale: The perceptual effect of global normalization depends on source dynamics and selected method.
quality_characteristics:
  - dimension: level_target_accuracy
    level: unknown
    evidence_kind: unknown
    rationale: Numeric output behavior is verified separately, but no reviewed perceptual prior exists.
  - dimension: perceived_loudness_match
    level: unknown
    evidence_kind: unknown
    rationale: RMS and peak targets are not equivalent to a listener-rated loudness match.
artifact_risks:
  - risk: clipping
    level: low
    evidence_kind: declared_design_fact
    rationale: The documented headroom contract is intended to keep peaks below the selected limit.
  - risk: over_amplified_background
    level: unknown
    evidence_kind: unknown
    rationale: Global gain can raise background with foreground; this requires case-specific review.
composition:
  supports_batch_targets: false
  cumulative_degradation_risk: low
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio_ref
    - path: params.target_db
      value_type: number
      required: true
      enum_values: []
      minimum: -60.0
      maximum: 0.0
      default: null
      semantic_role: target_level_db
    - path: params.method
      value_type: enum
      required: false
      enum_values:
        - rms
        - peak
      minimum: null
      maximum: null
      default: rms
      semantic_role: level_measurement_method
    - path: params.headroom_db
      value_type: number
      required: false
      enum_values: []
      minimum: -6.0
      maximum: 0.0
      default: -1.0
      semantic_role: peak_headroom_db
  framework_owned:
    - params.output_path
    - params.service_url
    - params.trace_id
  conditional_rules: []
limitations:
  - This is global level normalization; speaker- or span-scoped gain requires a selector/reconstruction wrapper.
  - RMS or peak normalization is not EBU R128 LUFS normalization.
  - The preferred method and target depend on the task and must be established by comparison cases rather than a global quality score.
  - The v1 capability schema expresses numeric ranges and method enums but cannot encode the semantic distinction between RMS targets, peak targets, and LUFS; operation-specific runtime semantics remain authoritative.
provenance:
  - source_path: x_editor/tools/skills/volume_normalizer.yaml
    source_kind: manual
  - source_path: x_editor/runtime/operation_normalizers.py
    source_kind: runtime_handler
  - source_path: x_editor/tools/catalog/edit_data_pipeline/client.py
    source_kind: runtime_handler
  - source_path: x_editor/tools/catalog/edit_data_pipeline/manual.yaml
    source_kind: service_schema
  - source_path: tests/test_operation_normalizers.py
    source_kind: test
