schema_version: x-editor.operation-capability-card/v1
operation: emphasis_stress_edit
semantic_effects:
  - add_lexical_emphasis
  - add_lexical_stress
supported_scopes:
  - lexical_boundary
  - segment
requirements:
  inputs:
    - inputs.input_audio
  evidence:
    - source_text
    - word_timestamps
    - target_phrase
preservation:
  - dimension: source_wording
    level: strong
    evidence_kind: declared_design_fact
    rationale: The route generates emphasis references but splices only the target phrase without changing the declared wording.
  - dimension: surrounding_speech
    level: strong
    evidence_kind: declared_design_fact
    rationale: The operation is explicitly implemented as local resynthesis and target-span assembly.
  - dimension: speaker_identity
    level: unknown
    evidence_kind: unknown
    rationale: SeedVC is used for speaker recovery, but no reviewed development prior establishes achieved similarity.
quality_characteristics:
  - dimension: lexical_prominence
    level: unknown
    evidence_kind: unknown
    rationale: Prominence must be established by listening review rather than the route description.
  - dimension: local_boundary_naturalness
    level: unknown
    evidence_kind: unknown
    rationale: F5 boundary normalization is part of the route, but achieved quality has not been measured here.
artifact_risks:
  - risk: speaker_identity_drift
    level: unknown
    evidence_kind: unknown
    rationale: The generative and voice-conversion stages can only be ranked after route comparison.
  - risk: local_splice_artifact
    level: unknown
    evidence_kind: unknown
    rationale: No reviewed development prior quantifies local splice artifacts.
composition:
  supports_batch_targets: true
  cumulative_degradation_risk: unknown
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: inputs.input_audio
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: source_audio_ref
    - path: params.source_text
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: reviewed_source_transcript
    - path: params.target_phrase
      value_type: string
      required: true
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: grounded_lexical_target
    - path: params.all_occurrences
      value_type: boolean
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: false
      semantic_role: target_occurrence_policy
    - path: params.language
      value_type: string
      required: false
      enum_values: []
      minimum: null
      maximum: null
      default: null
      semantic_role: source_language
  framework_owned:
    - params.output_path
    - params.emphasis_strategy
    - params.preserve_outer_boundaries
    - params.aligner_backend
    - params.smoothing
    - params.fallback_operation
    - params.qwen3_tts_instruct
    - params.target_voice_prompt
    - params.seed_vc_params
    - params.time_spans_from_source
    - params.time_spans_from_target
  conditional_rules: []
limitations:
  - The operation is available only when edit_data_pipeline, qwen3_tts, and seed_vc capabilities are registered.
  - It is for lexical emphasis, not ordinary pitch, global rate, emotion, accent, or wording changes.
  - Backend tuning parameters remain framework-owned until authoritative legal domains and quality priors exist.
  - The v1 capability schema cannot express that target_phrase must occur in reviewed source_text, must have word timestamps, or that all_occurrences must match the user's quantified intent; runtime admission remains authoritative.
provenance:
  - source_path: x_editor/runtime/audio_plan_executor.py
    source_kind: runtime_handler
  - source_path: x_editor/runtime/tool_contract_verifier.py
    source_kind: runtime_handler
  - source_path: x_editor/planner/skills/emphasis_stress_p1_local_resynthesis.yaml
    source_kind: manual
  - source_path: tests/test_workflow_component_adapters.py
    source_kind: test
