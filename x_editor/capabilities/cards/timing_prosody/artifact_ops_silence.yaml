schema_version: x-editor.operation-capability-card/v1
operation: artifact_ops.silence
semantic_effects:
  - generate_standalone_silence
supported_scopes:
  - standalone_asset
requirements:
  inputs: []
  evidence: []
preservation:
  - dimension: source_speech
    level: weak
    evidence_kind: declared_design_fact
    rationale: This operation creates a standalone silent artifact and does not preserve source speech in its output.
  - dimension: requested_audio_format
    level: strong
    evidence_kind: declared_design_fact
    rationale: When a reference input is bound by the framework, frame rate, channels, and sample width are copied.
quality_characteristics:
  - dimension: zero_waveform_fidelity
    level: high
    evidence_kind: declared_design_fact
    rationale: The implementation synthesizes a deterministic AudioSegment.silent artifact.
  - dimension: duration_precision
    level: high
    evidence_kind: declared_design_fact
    rationale: Requested seconds are rounded to integer milliseconds before rendering.
artifact_risks:
  - risk: hard_boundary_when_inserted_into_speech
    level: unknown
    evidence_kind: unknown
    rationale: This standalone operation does not perform insertion or boundary smoothing.
composition:
  supports_batch_targets: false
  cumulative_degradation_risk: low
parameter_contract:
  additional_parameters: reject
  planner_selectable:
    - path: params.duration_sec
      value_type: number
      required: true
      enum_values: []
      minimum: 0.0
      maximum: null
      default: null
      semantic_role: silence_duration_seconds
  framework_owned:
    - inputs.input_audio
    - params.output_path
  conditional_rules: []
limitations:
  - The output is a standalone silent WAV, not a natural speech pause editor.
  - Inserting the result into existing speech requires a separate concat or reconstruct operation and separate boundary-quality review.
  - Zero duration is mechanically legal but may be operationally unhelpful for an editing objective.
  - The v1 capability schema can express a non-negative minimum but cannot reject non-finite numeric encodings or express that standalone silence does not itself satisfy an edit-in-place objective.
provenance:
  - source_path: x_editor/runtime/artifact_ops.py
    source_kind: runtime_handler
  - source_path: x_editor/runtime/audio_plan_executor.py
    source_kind: runtime_handler
  - source_path: tests/test_artifact_ops.py
    source_kind: test
