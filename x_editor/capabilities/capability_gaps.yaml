    runtime_operations: [seamless_expressive_s2st]
    has_runtime_handler: true
    has_typed_card: false
    has_runtime_verifier: true
    blockers:
      - Expressive preservation and fallback behavior need service-specific listening review.
      - The operation cannot promise exact duration or original-voice identity.
    evidence_paths:
      - x_editor/runtime/audio_plan_executor.py
      - x_editor/tools/catalog/seamless_expressive_s2st/manual.yaml
    next_action: Freeze supported languages and fallback policy after real service canaries and listening review.
  - capability_key: accent_conversion
