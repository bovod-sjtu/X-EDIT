  - capability_key: foreground_background_nested_edit
    gap_class: contract_only_gap
    disposition: contract_work
    runtime_operations: []
    has_runtime_handler: true
    has_typed_card: false
    has_runtime_verifier: true
    blockers:
      - Nested edit_params and separation objects do not have recursively typed parameter contracts.
      - Nested operations need independent admission and verifier composition.
    evidence_paths:
      - x_editor/runtime/foreground_background_remix.py
    next_action: Define a typed nested-operation union before exposing Planner-authored nested edits.
  - capability_key: target_speaker_extraction
    gap_class: contract_only_gap
    disposition: contract_work
    runtime_operations: [tse]
    has_runtime_handler: true
    has_typed_card: false
    has_runtime_verifier: true
    blockers:
      - Reference-audio role and speaker-grounding evidence are not yet bound per audio_ref.
      - The current verifier proves delivery but not target-speaker selection.
    evidence_paths:
      - x_editor/runtime/audio_plan_executor.py
      - x_editor/tools/catalog/tse/mcp_server.py
    next_action: Finish the multi-audio evidence contract, then add an exact typed card and canary.
  - capability_key: expressive_speech_translation
