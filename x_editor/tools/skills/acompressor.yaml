skill_id: acompressor
display_name: 动态范围压缩器
source_mcp: ffmpeg
tool_names: [acompressor]

description: 减少音频动态范围，让大声和小声更接近，提升整体响度和一致性。
detailed_capability: |
  通过设定 threshold（阈值）和 ratio（压缩比）来控制动态范围。
  - threshold: 超过此电平的信号会被压缩
  - ratio: 压缩比例，如 4:1 表示输入超过阈值 4dB，输出只增加 1dB
  常用于：
  - 控制人声动态，使远处和近处音量一致
  - 为后续响度标准化做准备

dimensions: [dynamics]

parameters:
  - name: audio_path
    type: string
    required: true
    description: 输入音频文件路径
  - name: threshold
    type: number
    required: false
    default: -20.0
    description: 压缩阈值 (dB)
    constraints: "-60.0 ~ 0.0"
  - name: ratio
    type: number
    required: false
    default: 4.0
    description: 压缩比
    constraints: "1.0 ~ 20.0"
  - name: attack
    type: number
    required: false
    default: 20.0
    description: 攻击时间 (ms)
  - name: release
    type: number
    required: false
    default: 250.0
    description: 释放时间 (ms)
  - name: output_path
    type: string
    required: false
    default: auto
    description: 输出文件路径

output:
  type: audio_file
  description: 压缩后的音频文件

execution_constraints:
  should_run_before: [loudnorm]
  should_run_after: [equalizer, deesser, pitch_shift_rubberband]
  mutually_exclusive_with: []
  can_repeat: false

examples:
  - scenario: "温和压缩人声动态"
    parameters:
      threshold: -18.0
      ratio: 3.0
      attack: 10.0
      release: 200.0
    expected_outcome: "人声动态更均匀，呼吸声和爆破音被适度控制"

instruction_mapping:
  "dynamics.target:compressed": "threshold=-20~-12, ratio=3~6"
  "dynamics.target:normalized && 动态范围大": "先用 acompressor 再用 loudnorm"
