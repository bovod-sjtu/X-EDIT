[project]
name = "x-editor-seamless-expressive-s2st"
version = "0.1.0"
description = "X-Editor wrapper for Meta SeamlessExpressive and SeamlessM4T v2 speech-to-speech translation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "requests>=2.31",
  "pydantic>=2",
]

[project.scripts]
xeditor-seamless-s2st-service = "service:main"

[tool.setuptools]
py-modules = ["client", "service", "mcp_server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
