name: paralinguistic_event_bank
server:
  command: ["uv", "run", "--frozen", "--project", ".", "python", "mcp_server.py"]
  working_dir: "."
  env:
    UV_PROJECT_ENVIRONMENT: ".venv"
    UV_LINK_MODE: "copy"
    RUST_LOG: "warn"
    PYTHONNOUSERSITE: "1"
  resources:
    gpu: false
    memory_gb: 1
  lifecycle: session
  startup_timeout_sec: 30
