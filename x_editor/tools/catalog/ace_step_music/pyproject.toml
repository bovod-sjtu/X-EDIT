[project]
name = "xeditor-ace-step-music-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "requests>=2.31.0",
  "uvicorn[standard]>=0.27.0",
]

[project.scripts]
xeditor-ace-step-music-adapter = "service:main"

[tool.setuptools]
py-modules = ["client", "service", "mcp_server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
