    changed: [wording, language, speaker_identity, vocal_timbre, acoustic_properties, duration, local_timing]
    preserved: []
    unknown: []
  - operation: artifact_ops.speaker_scoped_edit
    temporal_scope: local_or_global
    changed: []
    preserved: []
    unknown: [wording, language, speaker_identity, vocal_timbre, acoustic_properties, duration, local_timing]
