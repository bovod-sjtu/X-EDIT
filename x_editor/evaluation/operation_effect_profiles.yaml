schema_version: x-editor.operation-evaluation-effects/v6
profiles:
  # Multiplicative gain preserves samples outside the declared intervals and
  # never resamples, normalizes, clips, or synthesizes. Scope requires runtime
  # evidence; this profile alone cannot prove a requested gain was achieved.
  - operation: artifact_ops.apply_gain
    temporal_scope: local_or_global
    local_interval_contract: source_target_spans
    identity_outside_local_intervals: true
    changed: [acoustic_properties]
    preserved: [wording, language, speaker_identity, vocal_timbre, duration, local_timing]
    unknown: []
  - operation: artifact_ops.beep_spans
    temporal_scope: local
    changed: [wording]
    preserved: [language, speaker_identity, vocal_timbre, duration, local_timing]
    unknown: [acoustic_properties]
  - operation: artifact_ops.concat
    temporal_scope: structural
    changed: [wording, language, speaker_identity, vocal_timbre, acoustic_properties, duration, local_timing]
    preserved: []
    unknown: []
  - operation: artifact_ops.extract_spans
    temporal_scope: structural
    local_interval_contract: selected_spans_extraction
    changed: [wording, speaker_identity, vocal_timbre, acoustic_properties, duration, local_timing]
    preserved: [language]
    unknown: []
  - operation: artifact_ops.mute_spans
    temporal_scope: local
    changed: [wording, acoustic_properties]
    preserved: [language, speaker_identity, vocal_timbre, duration, local_timing]
    unknown: []
  - operation: artifact_ops.reconstruct
    temporal_scope: structural
    changed: []
    preserved: []
    unknown: [wording, language, speaker_identity, vocal_timbre, acoustic_properties, duration, local_timing]
  - operation: artifact_ops.remove_spans
    temporal_scope: local
    local_interval_contract: selected_spans_removal
    changed: [wording, speaker_identity, vocal_timbre, acoustic_properties, duration, local_timing]
    preserved: [language]
    unknown: []
  - operation: artifact_ops.reorder_spans
    temporal_scope: structural
    changed: [wording, speaker_identity, vocal_timbre, acoustic_properties, duration, local_timing]
    preserved: [language]
    unknown: []
  - operation: artifact_ops.silence
