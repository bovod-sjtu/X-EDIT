workflow:
  - parse_add_or_remove_and_normalize_event_to_breath_laugh_cough_or_sigh
  - for_add_choose_or_generate_event_asset_then_insert_at_vad_pause_or_safe_boundary
  - for_add_loudness_match_crossfade_and_optionally_run_boundary_smooth_or_seedvc_self_conversion
  - for_remove_ground_event_span_with_flexsed_or_prior_runtime_evidence
  - for_remove_if_grounding_is_missing_try_local_energy_peak_fallback_but_never_whole_file_subtract
  - preserve_original_speech_content_and_speaker_identity_around_the_local_edit
rationale: >
  Paralinguistic add/remove requests can target nonverbal events such as breath,
  laugh, cough, and sigh. These are not lexical edits and should not
  trigger full-sentence TTS. Add is best handled by event-asset insertion; remove
  is best handled by local event span grounding followed by local inpaint/ducking.
guardrails:
  - Never route these add/remove paralinguistic event requests to edit_data_pipeline.text_edit.
  - Never route these requests to qwen3_tts as whole-utterance regeneration.
  - Do not treat laugh/cough/sigh/breath add/remove as emotion_style_edit or generic pitch/rate editing.
  - Remove must be local-only and must fail or record degraded grounding when no event span can be found.
  - Add may increase output duration by the inserted event duration; avoid covering speech when a pause or boundary is available.
  - SeedVC self conversion and boundary_smooth are optional post-processing/fallback stages and must preserve the pre-SeedVC/pre-smooth output in metadata.
