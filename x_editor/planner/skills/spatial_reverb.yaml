workflow:
  - spatial_reverb
rationale: Apply static room impulse response effects without changing speech content.
guardrails:
  - spatial_reverb changes only room/reverb/echo characteristics; it must not change transcript, speaker identity, emotion, or foreground/background selection.
  - Use it after local span editing when only one utterance should receive reverb, then reconstruct the original timeline.
  - Telephone, radio, underwater, wind, muffled, and reference channel effects belong to audio_effects, not spatial_reverb.
  - Dereverb and denoise requests belong to speech_enhancement, not spatial_reverb.
