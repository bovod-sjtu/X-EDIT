skill_id: affective_speaker_style_edit
description: Apply scoped emotion or affective speaking-style edits by selecting the target span and then using the matching edit-data-pipeline operation.
priority: 105
selected_tools: [perception.audio_fallback, artifact_ops]
runtime_operations: [artifact_ops.speaker_scoped_edit, edit_data_pipeline.emotion_style_edit, edit_data_pipeline.pitch_rate_edit]
negative_signals:
  - sing
  - singing
  - song
  - rap
  - rapping
  - accent
  - dialect
  - telephone
  - radio
  - underwater
  - wind
  - muffled
  - 唱歌
  - 歌唱
  - 说唱
  - 口音
  - 方言
positive_signals:
  - female speaker
  - male speaker
  - child speaker
  - speaker's first sentence
  - speaker's second sentence
  - speaker's first utterance
  - speaker's last utterance
  - first speaker's first sentence
  - second speaker's first sentence
  - speaker's first line
  - speaker's last utterance
  - ordinal speaker sentence
  - doting
  - affectionate
  - loving
  - tender
  - caring
  - fond
  - cheerful
  - soothing
  - calm
  - calmer
  - happy
  - happier
  - sad
  - sadder
  - angry
  - angrier
  - surprised
