skill_id: no_reference_voice_design
description: Use independent target-voice synthesis plus SeedVC when an existing/source audio must be converted to a described voice without a provided reference.
priority: 80
selected_tools: [perception.audio_fallback, no_reference_voice_conversion]
runtime_operations: [no_reference_voice_conversion]
